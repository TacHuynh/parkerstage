<rect x="0" y="0" width="2075" height="2398" fill="#ffffff"/>
<text x="48" y="26" font-size="17" font-weight="bold" fill="#1a1a1a">
parkerstage  ·  401200XR compound XYZ stage  ·  kinematic tree</text>
<text x="48" y="44" font-size="11" fill="#546e7a">
Three 401XR stages stacked: Y slides along world +Y, X along world +X (200 mm stroke each, centered on mid-stroke), and the Z stage (401XR 150) stands on the X carriage and slides along world +Z (150 mm stroke).  36 links / 35 joints / 3 prismatic DOF.  Home: y_slide +11.9 mm, x_slide +11.9 mm, z_slide +11.9 mm.
</text>
